<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HL PS2 ELF Patcher</title>
<style>
:root{
  --bg:#0b0b0f;--bg2:#111117;--bg3:#18181f;--bg4:#1e1e27;
  --border:#252530;--border2:#32323f;--border3:#3e3e50;
  --text:#f0f0f8;--text2:#8888aa;--text3:#55556a;
  --green:#00e676;--green2:#00c853;--green-bg:#00251a;--green-dim:#003d26;
  --red:#ff4f4f;--red-bg:#2a0a0a;
  --amber:#ffab00;--amber-bg:#251c00;
  --blue:#448aff;--blue-bg:#0a1428;
  --purple:#ce93d8;--purple-bg:#1a0d26;
  --cyan:#00e5ff;--cyan-bg:#00151a;
  --mono:'JetBrains Mono','Courier New',monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --radius:6px;--radius-lg:10px;
  --shadow:0 4px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px;min-height:100vh;overflow:hidden}

/* ── LANGUAGE MODAL ── */
.lang-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.lang-modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);width:340px;overflow:hidden;box-shadow:var(--shadow)}
.lang-modal-head{padding:1.5rem 1.5rem 1rem;border-bottom:1px solid var(--border)}
.lang-modal-logo{font-size:11px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin-bottom:.5rem}
.lang-modal-title{font-size:18px;font-weight:700;color:var(--text);letter-spacing:.5px}
.lang-modal-sub{font-size:12px;color:var(--text3);margin-top:.25rem}
.lang-options{padding:1rem}
.lang-option{display:flex;align-items:center;gap:12px;padding:.75rem 1rem;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg3);cursor:pointer;margin-bottom:.5rem;transition:all .15s}
.lang-option:hover{border-color:var(--green);background:var(--green-bg)}
.lang-option:last-child{margin-bottom:0}
.lang-flag{font-size:22px;flex-shrink:0}
.lang-name{font-size:14px;font-weight:600;color:var(--text)}
.lang-native{font-size:11px;color:var(--text3);margin-top:1px}
.lang-option .lang-check{margin-left:auto;color:var(--green);font-size:16px;display:none}

/* ── HEADER ── */
.hdr{height:52px;display:flex;align-items:center;gap:10px;padding:0 1.25rem;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0}
.hdr-logo{display:flex;align-items:center;gap:8px}
.hdr-logo-icon{width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,var(--green),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#000;letter-spacing:-1px;flex-shrink:0}
.hdr-logo-text{font-size:13px;font-weight:700;letter-spacing:1px;color:var(--text);text-transform:uppercase}
.hdr-logo-sub{font-size:10px;color:var(--text3);letter-spacing:.5px}
.hdr-divider{width:1px;height:20px;background:var(--border2);margin:0 4px}
.hdr-tag{font-size:10px;padding:2px 7px;border-radius:3px;border:1px solid var(--border2);color:var(--text3);letter-spacing:.5px;text-transform:uppercase;background:var(--bg3)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.hdr-file-info{font-size:11px;color:var(--text3);padding-right:4px}
.hdr-lang-btn{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg3);cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--text2);transition:all .15s;letter-spacing:.3px}
.hdr-lang-btn:hover{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.hdr-lang-btn .flag{font-size:14px}

/* ── SHELL ── */
.shell{display:flex;height:calc(100vh - 52px);overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{width:220px;flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto;background:var(--bg2);display:flex;flex-direction:column}
.sb-top{padding:.75rem .75rem .5rem;flex:1}
.sb-section{font-size:10px;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;padding:.6rem .5rem .3rem}
.sb-item{display:flex;align-items:center;gap:8px;padding:.45rem .75rem;cursor:pointer;color:var(--text2);border-radius:var(--radius);margin-bottom:2px;transition:all .12s;font-size:12px;position:relative}
.sb-item:hover{background:var(--bg3);color:var(--text)}
.sb-item.active{background:var(--green-bg);color:var(--green)}
.sb-item .sb-icon{font-size:14px;width:20px;text-align:center;flex-shrink:0}
.sb-item .sb-label{flex:1}
.sb-item .sb-cnt{font-size:10px;background:var(--bg4);color:var(--text3);padding:1px 6px;border-radius:10px;min-width:22px;text-align:center;transition:all .12s}
.sb-item.active .sb-cnt{background:var(--green-dim);color:var(--green)}
.sb-divider{height:1px;background:var(--border);margin:.4rem .5rem}
.sb-bottom{padding:.75rem;border-top:1px solid var(--border);background:var(--bg2)}
.sb-stat{font-size:11px;color:var(--text3);padding:.3rem 0;display:flex;justify-content:space-between}
.sb-stat b{color:var(--green)}

/* ── MAIN ── */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.main-inner{padding:1.25rem;flex:1}

/* ── DROP ZONE ── */
.drop-zone{border:1.5px dashed var(--border2);border-radius:var(--radius-lg);padding:3rem 2rem;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:1.5rem;background:var(--bg2);position:relative;overflow:hidden}
.drop-zone::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,230,118,.02) 0%,transparent 60%);pointer-events:none}
.drop-zone:hover,.drop-zone.drag{border-color:var(--green);background:var(--green-bg);box-shadow:0 0 0 1px var(--green-dim) inset}
.dz-icon{width:52px;height:52px;border-radius:12px;background:var(--bg3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;transition:all .2s}
.drop-zone:hover .dz-icon,.drop-zone.drag .dz-icon{border-color:var(--green);background:var(--green-bg)}
.dz-icon svg{opacity:.5;transition:opacity .2s}
.drop-zone:hover .dz-icon svg,.drop-zone.drag .dz-icon svg{opacity:1}
.dz-main{font-size:14px;color:var(--text2);margin-bottom:.35rem}
.dz-main b{color:var(--text)}
.dz-sub{font-size:11px;color:var(--text3)}
#file-input{display:none}

/* ── STATUS ── */
.status-bar{display:flex;align-items:center;gap:10px;padding:.65rem 1rem;border-radius:var(--radius);font-size:12px;margin-bottom:1.25rem;border:1px solid var(--border);background:var(--bg3);color:var(--text3)}
.status-bar.ok{border-color:var(--green-dim);background:var(--green-bg);color:var(--green)}
.status-bar.err{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.status-dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}

/* ── SUMMARY STRIP ── */
.summary-strip{display:flex;align-items:center;gap:16px;padding:.6rem 1rem;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);font-size:11px;color:var(--text2);margin-bottom:1.25rem;flex-wrap:wrap}
.summary-strip b{color:var(--text)}
.summary-strip .sum-green{color:var(--green);font-weight:600}
.summary-strip .sep{color:var(--border2)}

/* ── CAT INFO ── */
.cat-info{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:.85rem;overflow:hidden}
.cat-info-head{display:flex;align-items:center;gap:10px;padding:.75rem 1rem;cursor:pointer;user-select:none;transition:background .12s}
.cat-info-head:hover{background:var(--bg3)}
.cih-icon{font-size:18px;flex-shrink:0}
.cih-left{flex:1}
.cih-title{font-size:11px;font-weight:700;color:var(--amber);letter-spacing:1.5px;text-transform:uppercase}
.cih-sub{font-size:11px;color:var(--text3);margin-top:1px}
.cih-badge{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--bg4);border:1px solid var(--border2);color:var(--text3)}
.cih-chevron{color:var(--text3);transition:transform .2s;font-size:12px;flex-shrink:0}
.cih-chevron.open{transform:rotate(90deg)}
.cat-info-body{display:none;border-top:1px solid var(--border)}
.cat-info-body.open{display:block}
.cib-inner{padding:1rem 1.25rem;font-size:12px;color:var(--text2);line-height:1.9;background:linear-gradient(to bottom,var(--bg3),var(--bg2))}
.cib-inner p{margin-bottom:.3rem}
.cib-inner b{color:var(--text)}
.cib-inner code{font-family:var(--mono);background:var(--bg4);border:1px solid var(--border2);padding:1px 6px;border-radius:3px;font-size:11px;color:var(--cyan)}
.cib-inner ul{margin:.4rem 0 .4rem 1.1rem}
.cib-inner li{margin-bottom:.25rem}

/* ── PATCH GRID ── */
.patch-grid{display:flex;flex-direction:column;gap:4px;margin-bottom:1.25rem}

/* ── PATCH CARD ── */
.patch-card{border:1px solid var(--border);border-radius:var(--radius);background:var(--bg2);overflow:hidden;transition:border-color .15s,box-shadow .15s}
.patch-card:hover{border-color:var(--border2)}
.patch-card.enabled{border-color:var(--green-dim);box-shadow:0 0 0 1px var(--green-bg) inset}
.patch-head{display:flex;align-items:center;gap:10px;padding:.55rem 1rem;cursor:pointer;user-select:none;transition:background .1s}
.patch-head:hover{background:var(--bg3)}
.patch-name{font-size:12px;color:var(--text2);flex:1;transition:color .15s}
.patch-card.enabled .patch-name{color:var(--green)}
.patch-off{font-size:10px;color:var(--text3);font-family:var(--mono);letter-spacing:.5px}
.toggle{width:36px;height:20px;border-radius:10px;background:var(--bg4);border:1px solid var(--border2);position:relative;cursor:pointer;flex-shrink:0;transition:background .2s,border-color .2s}
.toggle.on{background:var(--green2);border-color:var(--green2)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .2s,box-shadow .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle.on::after{left:19px;box-shadow:0 1px 3px rgba(0,0,0,.4)}

.patch-body{display:none;padding:.75rem 1rem;border-top:1px solid var(--border);background:linear-gradient(to bottom,var(--bg3),var(--bg2))}
.patch-body.open{display:block}
.patch-desc{font-size:11px;color:var(--text3);line-height:1.7;margin-bottom:.7rem}
.field-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.field-label{font-size:11px;color:var(--text3);width:160px;flex-shrink:0}
.field-input{flex:1;font-family:var(--mono);font-size:12px;height:30px;padding:0 10px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg4);color:var(--text);outline:none;transition:border-color .15s}
.field-input:focus{border-color:var(--green);box-shadow:0 0 0 2px var(--green-bg)}
.bytes-row{display:flex;align-items:center;gap:4px;margin-top:8px;flex-wrap:wrap}
.bytes-lbl{font-size:10px;color:var(--text3);margin-right:2px}
.byte-b{width:28px;height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;font-family:var(--mono);border:1px solid var(--border);color:var(--text3);background:var(--bg4);transition:all .15s}
.byte-b.ch{border-color:var(--green);color:var(--green);background:var(--green-bg);box-shadow:0 0 6px rgba(0,230,118,.15)}
.nop-info{font-size:11px;color:var(--text3);margin-top:6px;display:flex;align-items:center;gap:6px}
.nop-info code{font-family:var(--mono);background:var(--green-bg);border:1px solid var(--green-dim);padding:1px 6px;border-radius:3px;font-size:10px;color:var(--green)}

/* ── ACTIONS ── */
.actions-bar{padding:1rem 1.25rem;border-top:1px solid var(--border);background:var(--bg2);display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0}
.btn{display:inline-flex;align-items:center;gap:7px;padding:0 16px;height:34px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font-family:var(--mono);font-size:12px;cursor:pointer;transition:all .12s;letter-spacing:.3px;white-space:nowrap;text-transform:uppercase}
.btn:hover{color:var(--text);border-color:var(--border3);background:var(--bg4)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.3;cursor:not-allowed;transform:none}
.btn-icon{font-size:14px}
.btn.primary{background:linear-gradient(135deg,var(--green),var(--green2));border:none;color:#000;font-weight:800;letter-spacing:.5px}
.btn.primary:hover:not(:disabled){opacity:.88;box-shadow:0 2px 12px rgba(0,230,118,.3)}
.btn.saveas{border-color:var(--purple-bg);color:var(--purple)}
.btn.saveas:hover{background:var(--purple-bg);border-color:var(--purple)}
.btn.danger{color:var(--text3)}
.btn.danger:hover{color:var(--red);border-color:var(--red-bg)}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--border3)}

/* ── EMPTY STATE ── */
.empty-state{text-align:center;padding:3rem 1rem;color:var(--text3)}
.empty-state p{font-size:12px;margin-top:.5rem}

/* ── HUD VISUALIZER ── */
.hud-viz{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:.85rem;overflow:hidden}
.hud-viz-head{display:flex;align-items:center;gap:10px;padding:.75rem 1rem;cursor:pointer;user-select:none;transition:background .12s;border-bottom:1px solid var(--border)}
.hud-viz-head:hover{background:var(--bg3)}
.hud-viz-title{font-size:11px;font-weight:700;color:var(--cyan);letter-spacing:1.5px;text-transform:uppercase}
.hud-viz-sub{font-size:11px;color:var(--text3);margin-top:1px}
.hud-viz-chevron{color:var(--text3);transition:transform .2s;font-size:12px;margin-left:auto}
.hud-viz-chevron.open{transform:rotate(90deg)}
.hud-viz-body{display:none}
.hud-viz-body.open{display:block}
.hud-viz-inner{padding:1rem 1.25rem;background:var(--bg3)}
.viz-layout{display:grid;grid-template-columns:190px 1fr;gap:1rem;align-items:start}
.viz-ch-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.viz-ch-lbl{font-size:12px;font-weight:700;width:12px;flex-shrink:0}
.viz-ch-lbl.r{color:#e05050}.viz-ch-lbl.g{color:#50c050}.viz-ch-lbl.b{color:#6090e0}
.viz-ch-val{font-size:11px;font-family:var(--mono);width:28px;text-align:right;color:var(--text2);flex-shrink:0}
.viz-range{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:2px;background:var(--bg4);border:1px solid var(--border2);outline:none;cursor:pointer}
.viz-range::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--text);border:2px solid var(--bg2);cursor:pointer}
.viz-swatch{width:100%;height:40px;border-radius:var(--radius);border:1px solid var(--border2);margin:10px 0 8px;display:flex;align-items:center;justify-content:center}
.viz-hex{font-family:var(--mono);font-size:12px;font-weight:700}
.viz-chips{display:flex;flex-wrap:wrap;gap:4px}
.viz-chip{font-size:10px;font-family:var(--mono);background:var(--bg4);border:1px solid var(--border2);border-radius:3px;padding:2px 7px;color:var(--text3)}
.viz-presets{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:10px}
.viz-preset{border:1px solid var(--border2);border-radius:var(--radius);padding:5px 3px;cursor:pointer;background:var(--bg4);display:flex;flex-direction:column;align-items:center;gap:4px;transition:border-color .12s}
.viz-preset:hover{border-color:var(--border3)}
.viz-preset.active{border-color:var(--cyan)}
.viz-preset-sw{width:100%;height:18px;border-radius:3px}
.viz-preset-nm{font-size:9px;color:var(--text3);text-align:center;line-height:1.3}
.viz-canvas-wrap{border-radius:var(--radius);overflow:hidden;border:1px solid var(--border2)}
.viz-canvas-wrap canvas{display:block;width:100%;height:auto}
</style>
</head>
<body>
<!-- LANGUAGE MODAL -->
<div class="lang-overlay" id="lang-overlay">
  <div class="lang-modal">
    <div class="lang-modal-head">
      <div class="lang-modal-logo">HL PS2 ELF PATCHER</div>
      <div class="lang-modal-title" id="lm-title">Select Language</div>
      <div class="lang-modal-sub" id="lm-sub">Choose your preferred language to continue</div>
    </div>
    <div class="lang-options">
      <div class="lang-option" data-lang="pt">
        <span class="lang-flag">🇧🇷</span>
        <div>
          <div class="lang-name">Português</div>
          <div class="lang-native">Brasileiro</div>
        </div>
        <span class="lang-check">✓</span>
      </div>
      <div class="lang-option" data-lang="en">
        <span class="lang-flag">🇺🇸</span>
        <div>
          <div class="lang-name">English</div>
          <div class="lang-native">American English</div>
        </div>
        <span class="lang-check">✓</span>
      </div>
    </div>
  </div>
</div>

<!-- HEADER -->
<header class="hdr">
  <div class="hdr-logo">
    <div class="hdr-logo-icon">HL</div>
    <div>
      <div class="hdr-logo-text">PS2 ELF Patcher</div>
      <div class="hdr-logo-sub">SLUS_200_66 · Gearbox 2001</div>
    </div>
  </div>
  <div class="hdr-divider"></div>
  <span class="hdr-tag" id="patch-count-tag">0 patches</span>
  <div class="hdr-right">
    <span class="hdr-file-info" id="hdr-file"></span>
    <button class="hdr-lang-btn" id="hdr-lang-btn">
      <span class="flag" id="hdr-flag">🌐</span>
      <span id="hdr-lang-label">—</span>
      <span style="color:var(--text3);font-size:10px">▼</span>
    </button>
  </div>
</header>

<div class="shell">
  <!-- SIDEBAR -->
  <nav class="sidebar" id="sidebar"></nav>

  <!-- MAIN -->
  <div class="main">
    <div class="main-inner">

      <!-- DROP ZONE -->
      <div class="drop-zone" id="drop-zone">
        <div class="dz-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="1.5">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="12" y1="18" x2="12" y2="12"/>
            <polyline points="9 15 12 12 15 15"/>
          </svg>
        </div>
        <p class="dz-main" id="dz-main"></p>
        <p class="dz-sub" id="dz-sub"></p>
      </div>
      <input type="file" id="file-input" accept=".elf,.ELF">

      <!-- STATUS -->
      <div class="status-bar" id="status-bar" style="display:none">
        <span class="status-dot"></span>
        <span id="status-text"></span>
      </div>

      <!-- PATCH UI -->
      <div id="patch-ui" style="display:none">
        <div class="summary-strip">
          <span><b id="s-active">0</b> <span id="s-active-lbl"></span></span>
          <span class="sep">·</span>
          <span><b id="s-total">0</b> <span id="s-avail-lbl"></span></span>
          <span class="sep">·</span>
          <span class="sum-green" id="s-file"></span>
        </div>
        <div id="patch-content"></div>
      </div>

    </div>

    <!-- ACTION BAR -->
    <div class="actions-bar" id="actions-bar" style="display:none">
      <button class="btn primary" id="btn-apply" disabled>
        <span class="btn-icon">▶</span><span id="btn-apply-lbl"></span>
      </button>
      <button class="btn saveas" id="btn-saveas" disabled>
        <span class="btn-icon">💾</span><span id="btn-saveas-lbl"></span>
      </button>
      <button class="btn danger" id="btn-reset">
        <span class="btn-icon">↺</span><span id="btn-reset-lbl"></span>
      </button>
    </div>
  </div>
</div>
<script>
// ════════════════════════════════════════════════════════
// I18N
// ════════════════════════════════════════════════════════
const I18N = {
pt:{
  lang_flag:'🇧🇷', lang_label:'Português',
  lm_title:'Selecionar idioma', lm_sub:'Escolha o idioma para continuar',
  nav_all:'Todos', nav_section:'Categorias',
  cat_all:'Todos os patches',
  cat_hud:'HUD — Cores',cat_hudpos:'HUD — Posições',
  cat_armas:'Armas — Ammo',cat_firerate:'Fire Rate',

// ════════════════════════════════════════════════════════
// PATCH BYTES — computes the output bytes for a patch
// ════════════════════════════════════════════════════════
function patchBytes(p){
  // Fixed NOP (00 00 00 00)
  if(p.nop) return [0x00,0x00,0x00,0x00];
  // Fixed replacement bytes
  if(p.patch) return [...p.patch];
  // Editable patch
  if(p.edit){
    const e=p.edit[0];
    const s=pstate[p.id];
    const out=[...p.orig];
    // Float IEEE 754 — stored in ORI instruction (little-endian 4 bytes)
    if(p.float){
      const v=parseFloat(s.val)||e.def;
      const buf=new ArrayBuffer(4);new DataView(buf).setFloat32(0,v,true);
      const bytes=new Uint8Array(buf);
      // Only patch the ORI (low 16 bits in little-endian): bytes 0-1 change, 2-3 keep from orig
      out[0]=bytes[0];out[1]=bytes[1];out[2]=bytes[2];out[3]=bytes[3];
      return out;
    }
    // LUI-only float: value stored in high 16 bits, low 16 = 0
    if(p.lui){
      const v=parseFloat(s.val)||e.def;
      const buf=new ArrayBuffer(4);new DataView(buf).setFloat32(0,v,true);
      const bytes=new Uint8Array(buf);
      // LUI instruction little-endian: [lo_instr_lo, lo_instr_hi, hi_float, lo_float]
      // For LUI the float hi16 is in bytes[2-3], instr opcode/reg in bytes[0-1] from orig
      out[0]=bytes[2];out[1]=bytes[3];// float high 16 bits
      // keep out[2] and out[3] (opcode) from orig
      return out;
    }
    // 16-bit unsigned value
    if(e.byte16){
      const v=Math.max(e.min,Math.min(e.max,parseInt(s.val)||e.def));
      out[0]=v&0xFF;out[1]=(v>>8)&0xFF;
      return out;
    }
    // 16-bit signed value
    if(e.byte16s){
      const v=Math.max(e.min,Math.min(e.max,parseInt(s.val)||e.def));
      const u=v<0?v+65536:v;
      out[0]=u&0xFF;out[1]=(u>>8)&0xFF;
      return out;
    }
    // 8-bit value at byte index e.byte (default 0)
    const byteIdx=e.byte||0;
    const v=Math.max(e.min,Math.min(e.max,parseInt(s.val)||e.def));
    out[byteIdx]=v&0xFF;
    return out;
  }
  return [...p.orig];
}

function getHudRGB(){
  const pr=PATCHES.find(x=>x.id==='hud_r');
  const pg=PATCHES.find(x=>x.id==='hud_g');
  const pb=PATCHES.find(x=>x.id==='hud_b');
  const R=pstate['hud_r'].on?(parseInt(pstate['hud_r'].val)||255):(pr?pr.orig[0]:255);
  const G=pstate['hud_g'].on?(parseInt(pstate['hud_g'].val)||160):(pg?pg.orig[0]:160);
  const B=pstate['hud_b'].on?(parseInt(pstate['hud_b'].val)||0):(pb?pb.orig[0]:0);
  return{R:Math.max(0,Math.min(255,R)),G:Math.max(0,Math.min(255,G)),B:Math.max(0,Math.min(255,B))};
}

function toHx(v){return v.toString(16).toUpperCase().padStart(2,'0')}

function drawVizCanvas(){
  const canvas=document.getElementById('viz-canvas');
  if(!canvas)return;
  const {R,G,B}=getHudRGB();
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height;
  const col=`rgb(${R},${G},${B})`;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0e0e12';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(0,0,0,.2)';
  for(let y=0;y<H;y+=4){ctx.fillRect(0,y,W,1)}
  // grid
  ctx.strokeStyle='rgba(255,255,255,.03)';ctx.lineWidth=1;
  for(let x=80;x<W;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=60;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  // crosshair
  ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(W/2-9,H/2);ctx.lineTo(W/2+9,H/2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W/2,H/2-9);ctx.lineTo(W/2,H/2+9);ctx.stroke();
  ctx.strokeStyle=col;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(W/2-5,H/2);ctx.lineTo(W/2+5,H/2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W/2,H/2-5);ctx.lineTo(W/2,H/2+5);ctx.stroke();
  ctx.textBaseline='middle';
  // HEALTH
  const hx2=18,hy=H-46;
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.beginPath();ctx.roundRect(hx2-4,hy-13,118,26,4);ctx.fill();
  ctx.fillStyle=col;ctx.font='15px monospace';ctx.fillText('♥',hx2,hy);
  ctx.font='bold 17px monospace';ctx.fillText('100',hx2+20,hy);
  // ARMOR
  const ax=hx2+122;
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.beginPath();ctx.roundRect(ax-4,hy-13,118,26,4);ctx.fill();
  ctx.fillStyle=col;ctx.font='15px monospace';ctx.fillText('⚡',ax,hy);
  ctx.font='bold 17px monospace';ctx.fillText('100',ax+20,hy);
  // AMMO (bottom right)
  const amx=W-18,amy=H-46;
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.beginPath();ctx.roundRect(amx-118,amy-13,122,26,4);ctx.fill();
  ctx.fillStyle=col;ctx.font='bold 17px monospace';ctx.textAlign='right';ctx.fillText('18',amx-34,amy);
  ctx.fillStyle=`rgba(${R},${G},${B},.55)`;ctx.font='12px monospace';ctx.fillText('/ 250',amx,amy);
  ctx.textAlign='left';
  // WEAPON label
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.roundRect(amx-88,amy-38,92,20,3);ctx.fill();
  ctx.fillStyle=`rgba(${R},${G},${B},.7)`;ctx.font='10px monospace';ctx.textAlign='right';
  ctx.fillText('GLOCK 17',amx,amy-26);ctx.textAlign='left';
  // FLASHLIGHT (top right)
  const flx=W-18,fly=18;
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.roundRect(flx-74,fly-10,78,20,3);ctx.fill();
  ctx.fillStyle=`rgba(${R},${G},${B},.85)`;ctx.font='10px monospace';ctx.textAlign='right';
  ctx.fillText('SUIT',flx-24,fly+1);
  ctx.fillStyle=`rgba(${R},${G},${B},.2)`;ctx.beginPath();ctx.roundRect(flx-22,fly-5,24,10,3);ctx.fill();
  ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(flx-22,fly-5,16,10,3);ctx.fill();
  ctx.textAlign='left';
  // KILL FEED
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.roundRect(W-194,40,192,16,3);ctx.fill();
  ctx.fillStyle=`rgba(${R},${G},${B},.6)`;ctx.font='9px monospace';ctx.textAlign='right';
  ctx.fillText('Soldier killed by GORDON',W-6,48);ctx.textAlign='left';
  // GEIGER
  for(let i=0;i<3;i++){
    ctx.fillStyle=`rgba(${R},${G},${B},${.12+i*.18})`;
    ctx.fillRect(10,H/2-38+i*14,5,9);
  }
  // MAP label
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.roundRect(6,6,86,14,3);ctx.fill();
  ctx.fillStyle=`rgba(${R},${G},${B},.45)`;ctx.font='9px monospace';
  ctx.fillText('c1a0 — Black Mesa',10,14);
}

function updateVizInfo(){
  const sw=document.getElementById('viz-swatch');
  const hexEl=document.getElementById('viz-hex');
  const chipRgb=document.getElementById('viz-chip-rgb');
  const chipHex=document.getElementById('viz-chip-hex');
  const chipBytes=document.getElementById('viz-chip-bytes');
  if(!sw)return;
  const {R,G,B}=getHudRGB();
  const hex=`#${toHx(R)}${toHx(G)}${toHx(B)}`;
  sw.style.background=hex;
  const brightness=(R*299+G*587+B*114)/1000;
  hexEl.style.color=brightness>140?'rgba(0,0,0,.55)':'rgba(255,255,255,.6)';
  hexEl.textContent=hex;
  if(chipRgb)chipRgb.textContent=`rgb(${R}, ${G}, ${B})`;
  if(chipHex)chipHex.textContent=hex;
  if(chipBytes)chipBytes.textContent=`${toHx(R)} ${toHx(G)} ${toHx(B)}`;
}

function syncVizSliders(){
  const {R,G,B}=getHudRGB();
  ['r','g','b'].forEach(ch=>{
    const sl=document.getElementById('viz-sl-'+ch);
    const vl=document.getElementById('viz-vl-'+ch);
    if(sl){sl.value=ch==='r'?R:ch==='g'?G:B;}
    if(vl){vl.textContent=ch==='r'?R:ch==='g'?G:B;}
  });
}

function updateVizPresetHighlight(){

function refreshViz(){
  syncVizSliders();
  updateVizInfo();

}

function attachVizEvents(){
  const head=document.getElementById('viz-toggle-head');
  if(head){
    head.addEventListener('click',()=>{
      vizOpen=!vizOpen;
      document.querySelector('.hud-viz-body').classList.toggle('open',vizOpen);
      document.querySelector('.hud-viz-chevron').classList.toggle('open',vizOpen);
      if(vizOpen)drawVizCanvas();
    });
  }
  ['r','g','b'].forEach(ch=>{
    const sl=document.getElementById('viz-sl-'+ch);
    if(!sl)return;
    sl.addEventListener('input',e=>{
      const val=parseInt(e.target.value);
      document.getElementById('viz-vl-'+ch).textContent=val;
      const pid='hud_'+ch;
      pstate[pid].on=true;
      pstate[pid].val=val;
      vizActivePreset=-1;
      updateVizInfo();
      drawVizCanvas();
      updateVizPresetHighlight();
      // sync patch card if visible
      const card=document.querySelector(`.patch-card[data-pid="${pid}"]`);
      if(card){
        card.classList.add('enabled');
        card.querySelector('.patch-name').style.color='var(--green)';
        card.querySelector('.toggle').classList.add('on');
        const inp=card.querySelector('.field-input');
        if(inp)inp.value=val;
        refreshBytes(pid);
      }
      renderSidebar();updateUI();
    });
  });
  document.querySelectorAll('.viz-preset').forEach((btn,i)=>{
    btn.addEventListener('click',()=>{
      const p=VIZ_PRESETS[i];
      vizActivePreset=i;
      ['r','g','b'].forEach(ch=>{
        const val=ch==='r'?p.r:ch==='g'?p.g:p.b;
        const pid='hud_'+ch;
        pstate[pid].on=true;
        pstate[pid].val=val;
        const card=document.querySelector(`.patch-card[data-pid="${pid}"]`);
        if(card){
          card.classList.add('enabled');
          card.querySelector('.patch-name').style.color='var(--green)';
          card.querySelector('.toggle').classList.add('on');
          const inp=card.querySelector('.field-input');
          if(inp)inp.value=val;
          refreshBytes(pid);
        }
      });
      syncVizSliders();
      updateVizInfo();
      drawVizCanvas();
      updateVizPresetHighlight();
      renderSidebar();updateUI();
    });
  });
  drawVizCanvas();
}

function renderCatInfo(cat){
  const info=L()['info_'+cat];
  if(!info)return'';
  const open=!!infoOpen[cat];
  const count=PATCHES.filter(p=>p.cat===cat).length;
  const body=info.body.replace(/\n/g,'<br>').replace(/<b>/g,'<b>').replace(/<\/b>/g,'</b>').replace(/<code>/g,'<code>').replace(/<\/code>/g,'</code>');
  return`<div class="cat-info">
    <div class="cat-info-head" data-info="${cat}">
      <span class="cih-icon">${t('icon_'+cat)}</span>
      <div class="cih-left">
        <div class="cih-title">${t('cat_'+cat)}</div>
        <div class="cih-sub">${info.title}</div>
      </div>
      <span class="cih-badge">${count} ${t('patches_hdr')}</span>
      <span class="cih-chevron${open?' open':''}">▶</span>
    </div>
    <div class="cat-info-body${open?' open':''}">
      <div class="cib-inner">${body}</div>
    </div>
  </div>`;
}

function renderCard(p){
  const s=pstate[p.id];
  const name=p.n[lang]||p.n.pt;
  const desc=p.d[lang]||p.d.pt;
  const patched=s.on?patchBytes(p):[...p.orig];
  const changed=s.on&&patched.some((b,i)=>b!==p.orig[i]);
  const boxes=patched.map((b,i)=>`<span class="byte-b${changed&&b!==p.orig[i]?' ch':''}">${hx(b)}</span>`).join('');
  let field='';
  if(!p.nop&&!p.patch&&p.edit){
    const e=p.edit[0];
    const lbl=lang==='en'?(e.le||e.lp):e.lp;
    field=`<div class="field-row">
      <span class="field-label">${lbl}</span>
      <input class="field-input" type="number" min="${e.min}" max="${e.max}" step="${e.step||1}" value="${s.val}" data-pid="${p.id}">
    </div>`;
  }
  const patchNote=p.patch?`<div class="nop-info">→ <code>${p.patch.map(b=>b.toString(16).toUpperCase().padStart(2,'0')).join(' ')}</code></div>`:'';
  const nopNote=p.nop?`<div class="nop-info">→ <code>00 00 00 00</code> (NOP MIPS)</div>`:'';
  return`<div class="patch-card${s.on?' enabled':''}" data-pid="${p.id}">
    <div class="patch-head" data-pid="${p.id}">
      <span class="patch-name">${name}</span>
      <span class="patch-off">0x${p.offset.toString(16).toUpperCase().padStart(8,'0')}</span>
      <button class="toggle${s.on?' on':''}" data-pid="${p.id}" aria-label="toggle"></button>
    </div>
    <div class="patch-body${s.open?' open':''}">
      <div class="patch-desc">${desc}</div>
      ${field}${nopNote}${patchNote}
      <div class="bytes-row"><span class="bytes-lbl">${t('bytes')}</span>${boxes}</div>
    </div>
  </div>`;
}

function renderAll(){
  const cats=currentCat==='all'?[...new Set(PATCHES.map(p=>p.cat))]:[currentCat];
  let html='';
  cats.forEach(cat=>{
    const ps=PATCHES.filter(p=>p.cat===cat);
    if(cat==='hud')html+=renderHudViz();
    html+=renderCatInfo(cat);
    html+=`<div class="patch-grid">${ps.map(renderCard).join('')}</div>`;
  });
  document.getElementById('patch-content').innerHTML=html;
  attachEvents();
  attachVizEvents();
  renderSidebar();
  updateUI();
}

function attachEvents(){
  const c=document.getElementById('patch-content');
  c.querySelectorAll('.cat-info-head').forEach(h=>{
    h.addEventListener('click',()=>{
      const cat=h.dataset.info;
      infoOpen[cat]=!infoOpen[cat];
      h.nextElementSibling.classList.toggle('open',infoOpen[cat]);
      h.querySelector('.cih-chevron').classList.toggle('open',infoOpen[cat]);
    });
  });
  c.querySelectorAll('.patch-head').forEach(h=>{
    h.addEventListener('click',e=>{
      const tog=e.target.closest('.toggle');
      if(tog){e.stopPropagation();toggleOn(tog.dataset.pid);return}
      const pid=h.dataset.pid;
      pstate[pid].open=!pstate[pid].open;
      h.nextElementSibling.classList.toggle('open',pstate[pid].open);
    });
  });
  c.querySelectorAll('.field-input').forEach(inp=>{
    inp.addEventListener('input',()=>{
      pstate[inp.dataset.pid].val=inp.value;
      refreshBytes(inp.dataset.pid);
      if(['hud_r','hud_g','hud_b'].includes(inp.dataset.pid))refreshViz();
    });
  });
}

function toggleOn(pid){
  pstate[pid].on=!pstate[pid].on;
  const card=document.querySelector(`.patch-card[data-pid="${pid}"]`);
  if(!card)return;
  card.classList.toggle('enabled',pstate[pid].on);
  card.querySelector('.patch-name').style.color=pstate[pid].on?'var(--green)':'';
  card.querySelector('.toggle').classList.toggle('on',pstate[pid].on);
  refreshBytes(pid);
  if(['hud_r','hud_g','hud_b'].includes(pid))refreshViz();
  renderSidebar();
  updateUI();
}

function refreshBytes(pid){
  const p=PATCHES.find(x=>x.id===pid);
  const card=document.querySelector(`.patch-card[data-pid="${pid}"]`);
  if(!card)return;
  const s=pstate[pid];
  const patched=s.on?patchBytes(p):[...p.orig];
  const changed=s.on&&patched.some((b,i)=>b!==p.orig[i]);
  const row=card.querySelector('.bytes-row');
  if(!row)return;
  row.innerHTML=`<span class="bytes-lbl">${t('bytes')}</span>`+
    patched.map((b,i)=>`<span class="byte-b${changed&&b!==p.orig[i]?' ch':''}">${hx(b)}</span>`).join('');
}

function updateUI(){
  const active=PATCHES.filter(p=>pstate[p.id].on).length;
  document.getElementById('s-active').textContent=active;
  document.getElementById('s-total').textContent=PATCHES.length;
  document.getElementById('s-active-lbl').textContent=t('active');
  document.getElementById('s-avail-lbl').textContent=t('available');
  const canSave=fileBytes&&active>0;
  document.getElementById('btn-apply').disabled=!canSave;
  document.getElementById('btn-saveas').disabled=!canSave;
  document.getElementById('btn-apply-lbl').textContent=t('apply');
  document.getElementById('btn-saveas-lbl').textContent=t('saveas');
  document.getElementById('btn-reset-lbl').textContent=t('reset');
}

// ════════════════════════════════════════════════════════
// FILE
// ════════════════════════════════════════════════════════
function showStatus(msg,type){
  const bar=document.getElementById('status-bar');
  bar.style.display='flex';bar.className='status-bar'+(type?' '+type:'');
  document.getElementById('status-text').textContent=msg;
}

function loadFile(file){
  if(!file)return;
  fileName=file.name;
  const r=new FileReader();r.onload=e=>{
    fileBytes=new Uint8Array(e.target.result);
    const mb=(fileBytes.length/1048576).toFixed(2);
    document.getElementById('hdr-file').textContent=`${file.name}  ·  ${mb} MB`;
    document.getElementById('drop-zone').style.display='none';
    document.getElementById('patch-ui').style.display='block';
    document.getElementById('actions-bar').style.display='flex';
    document.getElementById('s-file').textContent=`${file.name} — ${mb} MB`;
    showStatus(t('loaded').replace('{n}',PATCHES.length),'ok');
    renderAll();
  };r.readAsArrayBuffer(file);
}

const dz=document.getElementById('drop-zone');
dz.addEventListener('click',()=>document.getElementById('file-input').click());
document.getElementById('file-input').addEventListener('change',e=>loadFile(e.target.files[0]));
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag')});
dz.addEventListener('dragleave',()=>dz.classList.remove('drag'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag');loadFile(e.dataTransfer.files[0])});

// ════════════════════════════════════════════════════════
// BUILD & SAVE
// ════════════════════════════════════════════════════════
function buildOut(){
  const out=new Uint8Array(fileBytes);let n=0;
  PATCHES.forEach(p=>{if(!pstate[p.id].on)return;patchBytes(p).forEach((b,i)=>{out[p.offset+i]=b});n++});
  return{out,n};
}
function dlBlob(bytes,name){
  const url=URL.createObjectURL(new Blob([bytes],{type:'application/octet-stream'}));
  const a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);
}

document.getElementById('btn-apply').addEventListener('click',()=>{
  if(!fileBytes)return;const{out,n}=buildOut();
  dlBlob(out,fileName);showStatus(t('applied').replace('{n}',n),'ok');
});

document.getElementById('btn-saveas').addEventListener('click',async()=>{
  if(!fileBytes)return;const{out,n}=buildOut();
  if(window.showSaveFilePicker){
    try{
      const fh=await showSaveFilePicker({suggestedName:fileName,types:[{description:'PS2 ELF',accept:{'application/octet-stream':['.elf','.ELF']}}]});
      const ws=await fh.createWritable();await ws.write(out);await ws.close();
      showStatus(t('applied').replace('{n}',n),'ok');
    }catch(err){if(err.name!=='AbortError'){dlBlob(out,fileName);showStatus(t('applied').replace('{n}',n),'ok')}}
  }else{dlBlob(out,fileName);showStatus(t('applied').replace('{n}',n),'ok')}
});

document.getElementById('btn-reset').addEventListener('click',()=>{
  PATCHES.forEach(p=>{pstate[p.id]={on:false,val:p.edit?p.edit[0].def:null,open:false}});
  renderAll();showStatus(t('reset_msg'),'');
});

// ════════════════════════════════════════════════════════
// LANGUAGE
// ════════════════════════════════════════════════════════
function applyLang(l){
  lang=l;const L2=I18N[l];
  document.getElementById('hdr-flag').textContent=L2.lang_flag;
  document.getElementById('hdr-lang-label').textContent=L2.lang_label;
  document.getElementById('dz-main').innerHTML=L2.dz_main;
  document.getElementById('dz-sub').textContent=L2.dz_sub;
  document.getElementById('lm-title').textContent=L2.lm_title;
  document.getElementById('lm-sub').textContent=L2.lm_sub;
  if(fileBytes)renderAll();else{renderSidebar();updateUI()}
}

// Language modal
document.getElementById('lang-overlay').querySelectorAll('.lang-option').forEach(opt=>{
  opt.addEventListener('click',()=>{
    const l=opt.dataset.lang;
    document.getElementById('lang-overlay').style.display='none';
    applyLang(l);
  });
});

// Re-open modal from header button
document.getElementById('hdr-lang-btn').addEventListener('click',()=>{
  document.getElementById('lang-overlay').style.display='flex';
});

// ════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════
renderSidebar();
updateUI();

</script>
</body>
</html>
